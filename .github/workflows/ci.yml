name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        run: cargo audit

  dashboard:
    name: Dashboard (WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/rookery-dashboard
      - uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      # The dashboard crate is `exclude`d from the workspace, so every other job
      # here skips it entirely. Without this job a dashboard change that does not
      # compile passes CI green.
      - name: Format
        run: cargo fmt --manifest-path crates/rookery-dashboard/Cargo.toml --check
      - name: Clippy
        run: |
          cargo clippy --manifest-path crates/rookery-dashboard/Cargo.toml \
            --target wasm32-unknown-unknown --all-targets -- -D warnings

      # Prove the release build works. Deliberately NOT a `git diff --exit-code`
      # against the committed dist/: wasm output is not byte-reproducible across
      # toolchain versions, so that check would fail whenever CI's rustc differs
      # from a contributor's, and a gate that cries wolf gets ignored.
      #
      # Freshness of the SHIPPED artifact is guaranteed in release.yml instead,
      # which rebuilds dist/ before cargo build. This job only has to catch
      # dashboard code that does not compile.
      - name: Release build
        run: cd crates/rookery-dashboard && trunk build --release

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - name: Check MSRV
        run: cargo check --workspace
