    <!-- -all enables every wasm feature for validation.
         Current rustc emits bulk-memory (memory.copy) and nontrapping
         float-to-int (i64.trunc_sat_f64_s); trunk's bundled wasm-opt rejects
         both by default and the release build fails validation outright.
         Enabling them individually means chasing each new feature rustc adopts,
         so take the whole set — the output still contains only what rustc
         emitted, and the browser targets here support all of it. -->
    
<script type="module">
import init, * as bindings from '/rookery-dashboard-2706fe03be8ab9c0.js';
const wasm = await init({ module_or_path: '/rookery-dashboard-2706fe03be8ab9c0_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
